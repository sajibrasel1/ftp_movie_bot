name: MLSBD Movie Splitter & Telegram Uploader v2

# Triggered manually via GitHub API from cPanel
on:
  workflow_dispatch:
    inputs:
      movie_id:
        description: 'Database movie ID'
        required: true
        type: string
      movie_title:
        description: 'Movie title'
        required: true
        type: string
      movie_url:
        description: 'Primary download URL (usually GDFlix)'
        required: true
        type: string
      download_links:
        description: 'JSON string of all download links for fallback'
        required: false
        type: string
        default: '{}'
      poster_url:
        description: 'Movie poster URL from MLSBD'
        required: false
        type: string
        default: ''

env:
  ACTIONS_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours maximum
    
    steps:
      # ============================================
      # Step 1: Setup Environment
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup Chrome and ChromeDriver
        run: |
          # Install Chrome
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable ffmpeg
          
          # Get Chrome version
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d'.' -f1)
          echo "Chrome version: $CHROME_VERSION"
          
          # Download matching ChromeDriver
          CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_VERSION}")
          echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
          
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -q chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          rm -rf chromedriver-linux64 chromedriver-linux64.zip
          
          # Verify installation
          chromedriver --version
          google-chrome --version
          ffmpeg -version
      
      # ============================================
      # Step 2: Display Workflow Info
      # ============================================
      - name: Display workflow information
        run: |
          echo "============================================"
          echo "MLSBD Movie Processing Workflow Started"
          echo "============================================"
          echo "Movie ID: ${{ github.event.inputs.movie_id }}"
          echo "Movie Title: ${{ github.event.inputs.movie_title }}"
          echo "Primary URL: ${{ github.event.inputs.movie_url }}"
          echo "Download Links: ${{ github.event.inputs.download_links }}"
          echo "Runner: $(uname -a)"
          echo "Disk Space Available:"
          df -h
          echo "Memory Available:"
          free -h
          echo "============================================"
      
      # ============================================
      # Step 3: Process Movie
      # ============================================
      - name: Resolve, download, split, and upload movie
        env:
          MOVIE_ID: ${{ github.event.inputs.movie_id }}
          MOVIE_TITLE: ${{ github.event.inputs.movie_title }}
          MOVIE_URL: ${{ github.event.inputs.movie_url }}  # Primary download URL
          DOWNLOAD_LINKS: ${{ github.event.inputs.download_links }}  # All download links for fallback
          POSTER_URL: ${{ github.event.inputs.poster_url }}  # Poster URL
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DB_API_URL: ${{ secrets.DB_API_URL }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: |
          python mlsbd_worker.py
      
      # ============================================
      # Step 4: Cleanup (runs even if previous step fails)
      # ============================================
      - name: Cleanup temporary files
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          rm -f movie.*
          rm -f part_*.mp4
          rm -f part_*.mkv
          df -h
          echo "Cleanup completed"
      
      # ============================================
      # Step 5: Report Status
      # ============================================
      - name: Report completion
        if: success()
        run: |
          echo "============================================"
          echo "✅ MLSBD Movie processing completed successfully"
          echo "Movie: ${{ github.event.inputs.movie_title }}"
          echo "============================================"
      
      - name: Report failure
        if: failure()
        run: |
          echo "============================================"
          echo "❌ MLSBD Movie processing failed"
          echo "Movie: ${{ github.event.inputs.movie_title }}"
          echo "Check logs above for error details"
          echo "============================================"
